<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Commu se Connecte — Carte des membres</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--prune:#243c6b;--violine:#965093;--violet:#965093;--bleu:#4b91b3;--saumon:#fbc89a;--lavande:#f5eaf4;--papier:#fffdfb;--texte:#35415a;--secondaire:#66718a;--bord:#e3e7ef}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:var(--texte);font:15px/1.6 system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #a879c2;outline-offset:4px}header{height:100px;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:16px 30px;background:linear-gradient(105deg,#356f8c 0%,#397b9b 60%,#4b91b3 100%);border-bottom:3px solid #c9dfed;box-shadow:0 3px 16px #243c6b12}.brand{font:800 32px/1.2 Manrope,system-ui,sans-serif;letter-spacing:-.7px;color:#ffffff}.brand small{display:block;font:500 13px/1.5 Manrope,system-ui,sans-serif;letter-spacing:.15px;color:#ffffff;margin-top:7px}.searchbox{position:relative;width:min(340px,42vw)}#search{width:100%;padding:11px 16px;background:#ffffff;border:1px solid #d8e6ef;border-radius:24px;color:var(--prune)}#search::placeholder{color:#7a6b80}.results{position:absolute;top:52px;right:0;left:0;background:var(--papier);border:1px solid var(--bord);border-radius:15px;box-shadow:0 10px 30px #482b501a;z-index:10;max-height:300px;overflow:auto}.result{display:block;width:100%;border:0;border-bottom:1px solid var(--bord);padding:14px;text-align:left;background:transparent;color:var(--prune)}.result:hover{background:var(--lavande)}.result small{display:block;color:var(--secondaire)}.maparea{position:relative;height:calc(100dvh - 100px);min-height:400px}#map{position:absolute;inset:0}.caption{position:absolute;top:22px;left:22px;max-width:240px;padding:15px 19px;border-radius:18px;background:#fbd7b7;border:1px solid #f0c49d;box-shadow:0 5px 24px #243c6b16;pointer-events:none}.caption strong{font:600 24px/1.3 Lora,Georgia,serif;color:var(--prune)}.caption small{display:block;font-size:12px;line-height:1.7;color:#3a4a65;margin-top:8px}.error,.data-error{position:absolute;bottom:65px;left:15px;right:15px;background:var(--papier);color:var(--texte);padding:14px 16px;border:1px solid var(--bord);border-radius:12px;z-index:4}.error{bottom:120px}.error button,.data-error button{margin-left:10px;background:var(--violine);color:white;border:0;border-radius:8px;padding:8px 14px}dialog{position:fixed;border:1px solid #ffffffb3;padding:0;width:min(460px,calc(100vw - 28px));max-height:calc(100dvh - 32px);overflow:auto;border-radius:25px;background:var(--papier);color:var(--texte);box-shadow:0 24px 90px #34223f40;scrollbar-width:thin;scrollbar-color:#cbb2d6 var(--papier)}dialog::backdrop{background:#39274440;backdrop-filter:blur(3px)}.photoarea{position:relative;background:var(--lavande)}.portrait{display:block;width:100%;height:auto;aspect-ratio:4 / 3;object-fit:cover;object-position:50% 8%}.photo-error{padding:35px 24px;margin:0;color:var(--prune);font-size:13px}.close{position:absolute;top:13px;right:13px;background:#fbd7b7;color:var(--prune);border:1px solid #f0c49d;border-radius:50%;height:38px;width:38px;font-size:24px;z-index:2;box-shadow:0 3px 14px #482b501c}.close:hover{background:#fbc89a}.content{padding:25px 27px 29px}h1{font-size:25px;line-height:1.25;margin:0 0 12px;font-weight:600;color:var(--prune)}.conjoncture{display:inline-block;background:var(--lavande);border-radius:20px;padding:5px 12px;color:#965093;font-size:14px;margin:0}.profile-city{margin:10px 0 0;color:var(--secondaire);font-size:14px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--bord);margin:23px 0 20px;padding-bottom:8px}.tabs button{--tab-text:#793f77;--tab-bg:#faf2f9;--tab-active:#f0dfef;--tab-line:#965093;flex:1;min-width:0;padding:10px 7px;color:var(--tab-text);background:var(--tab-bg);border:0;border-radius:10px;font-size:13px;font-weight:500;transition:background .15s ease}.tabs button:hover{background:var(--tab-active)}.tabs button[data-theme=reseaux]{--tab-text:#243c6b;--tab-bg:#eff4fa;--tab-active:#dfeaf6;--tab-line:#4b91b3}.tabs button[data-theme=contact]{--tab-text:#874629;--tab-bg:#fff2e8;--tab-active:#fbdcc3;--tab-line:#c9814e}.tabs button[aria-selected=true]{background:var(--tab-active);color:var(--tab-text);box-shadow:inset 0 -3px var(--tab-line)}.bio{white-space:pre-line;font-size:14px;line-height:1.85;color:#45516a}.socials{display:flex;gap:10px;flex-wrap:wrap;padding:2px 0 5px}.socials a{--bouton:#74458e;--fond:#f4edf8;--survol:#eaddf1;display:flex;align-items:center;justify-content:flex-start;min-height:45px;min-width:45px;padding:10px 13px;border-radius:12px;border:1px solid transparent;background:var(--fond);color:var(--bouton);text-decoration:none;transition:background .15s ease,box-shadow .15s ease}.socials a:hover{background:var(--survol);box-shadow:0 3px 10px #482b5010}.socials a[data-kind=site]{--bouton:#835e13;--fond:#fff5d9;--survol:#f7e5ae}.socials a[data-kind=phone]{--bouton:#126875;--fond:#e4f5f7;--survol:#c8e9ee}.socials a[data-kind=email]{--bouton:#a34330;--fond:#fff0e9;--survol:#ffded0}.socials a[data-kind=whatsapp]{--bouton:#187343;--fond:#e4f7e8;--survol:#c5eed2}.socials a[data-kind=instagram]{--bouton:#aa386e;--fond:#fcecf4;--survol:#f8d5e7}.socials a[data-kind=facebook]{--bouton:#285ea7;--fond:#ecf2ff;--survol:#d7e5ff}.socials a[data-kind=linkedin]{--bouton:#176374;--fond:#e7f4f6;--survol:#cee8ed}.socials a[data-kind=youtube]{--bouton:#b52e3d;--fond:#ffeded;--survol:#ffd6dc}.socials a[data-kind=tiktok]{--bouton:#874581;--fond:#f7edf7;--survol:#edd8eb}.socials svg{width:20px;height:20px;display:block}.contact-name{margin-left:8px;font-size:13px;font-weight:500}.testnote{position:absolute;bottom:30px;left:12px;font-size:11px;color:var(--prune);background:#fffdfbeb;padding:4px 10px;border-radius:7px;pointer-events:none}.cluster-list{max-height:260px;overflow:auto;color:var(--prune)}.cluster-list strong{display:block;padding:8px}.maplibregl-popup-content{border-radius:15px;padding:12px;background:var(--papier)}[hidden]{display:none!important}@media(max-width:600px){header{background:#397792;height:140px;padding:12px 16px;flex-wrap:wrap;align-content:center;gap:11px}.brand{font-size:clamp(21px,5.8vw,28px);letter-spacing:-.5px}.brand small{font-size:11px;letter-spacing:0;margin-top:4px}.searchbox{width:100%}#search{padding:8px 13px}.results{top:42px}.maparea{height:calc(100dvh - 140px)}.caption{top:12px;left:12px;padding:11px 14px;max-width:210px}.caption strong{font-size:21px}.caption small{font-size:11px}.content{padding:22px 20px 25px}h1{font-size:24px}.tabs{gap:3px}.tabs button{font-size:12px;padding:10px 5px}.testnote{max-width:80%}}@media(prefers-reduced-motion:reduce){.socials a{transition:none}}
</style></head><body><header><div class="brand">La Commu se Connecte<small>Une carte, des talents, des connexions.</small></div><div class="searchbox"><input type="search" id="search" aria-label="Rechercher un membre ou une ville" placeholder="Rechercher un membre, une ville…" autocomplete="off"><div id="results" class="results" aria-live="polite" hidden></div></div></header><main class="maparea"><div id="map" role="region" aria-label="Carte du monde des membres de la communauté"></div><div class="caption"><strong>T’es où dans la commu ?</strong><small>Clique sur une épingle pour découvrir un membre de la commu.</small></div><div id="error" class="error" role="status" hidden></div><div id="data-error" class="data-error" role="status" hidden></div><div class="testnote" id="data-status" role="status">Chargement des membres…</div></main><dialog id="profile" aria-label="Fiche du membre"><div id="profile-body"></div></dialog><script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script>
'use strict';
const DATA_URL="https://script.google.com/macros/s/AKfycby34X2jYa4-_nPDZ6H2XbiD6QRguanzWnq4_qMJZkXtNT_iQbD0LbMbxY8jvLwjQRiV-A/exec";const $=id=>document.getElementById(id);let MEMBERS=[],map,loaded=false,lastFocus,currentMemberId=null,inFlight=false;
const normalize=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const paths={site:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/>',email:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',phone:'<path d="M5 3h4l2 5-3 2c2 3 3 4 6 6l2-3 5 2v4c0 2-3 3-5 2C8 18 3 13 3 6c0-2 0-3 2-3Z"/>',whatsapp:'<path d="M4 17 3 22l5-2a9 9 0 1 0-4-3Z"/><path d="m8 7 2 3-1 1 4 4 1-1 3 2"/>',instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".7"/>',facebook:'<path d="M14 21V13h3l1-4h-4V7c0-1 1-2 2-2h2V2h-3c-4 0-5 2-5 5v2H7v4h3v8"/>',youtube:'<rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/>',linkedin:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 10v7M11 17v-7m0 3c0-4 6-4 6 0v4M7 7h.01"/>',tiktok:'<path d="M14 3v12a4 4 0 1 1-4-4M14 3c0 4 3 6 6 6"/>'};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e;}
function icon(kind){const span=el('span');span.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(paths[kind]||paths.site)+'</svg>';return span;}
function contact(c,compact=false){if(!c.value?.trim())return null;let href=c.value.trim();if(c.kind==='email')href='mailto:'+href;else if(c.kind==='phone')href='tel:'+href.replace(/[^+\d]/g,'');else if(c.kind==='whatsapp')href='https://wa.me/'+href.replace(/\D/g,'');else {if(!/^https?:\/\//i.test(href))href='https://'+href;try{const u=new URL(href);if(!['http:','https:'].includes(u.protocol))return null;}catch{return null;}}const kind=c.kind==='url'?({'Instagram':'instagram','Facebook':'facebook','LinkedIn':'linkedin','YouTube':'youtube','TikTok':'tiktok'}[c.label]||'site'):c.kind;const a=el('a');a.href=href;a.setAttribute('aria-label',c.label);a.title=c.label;a.setAttribute('data-kind',kind);a.append(icon(kind));if(!compact)a.append(el('span','contact-name',c.label));if(!['email','phone'].includes(c.kind)){a.target='_blank';a.rel='noopener noreferrer';}return a;}
function openProfile(m){currentMemberId=m.id;lastFocus=document.activeElement;const panel=$('profile-body');panel.replaceChildren();const media=el('div','photoarea');const close=el('button','close','×');close.type='button';close.setAttribute('aria-label','Fermer la fiche');close.onclick=()=>$('profile').close();media.append(close);if(m.photo){const img=el('img','portrait');img.alt='Photo de '+(m.name||'ce membre');img.referrerPolicy='no-referrer';img.src=m.photo;img.onerror=()=>{img.hidden=true;const note=el('p','photo-error','La photo Drive ne peut pas être chargée. Son accès public reste à vérifier.');media.append(note);};media.append(img);}panel.append(media);const content=el('div','content');if(m.name)content.append(el('h1','',m.name));if(m.conjoncture?.trim())content.append(el('p','conjoncture',m.conjoncture));if(m.city?.trim())content.append(el('p','profile-city',m.city));const sections=[];if(m.bio?.trim())sections.push(['Présentation',el('div','bio',m.bio)]);const networks=el('div','socials'),contacts=el('div','socials');m.contacts.forEach(c=>{const a=contact(c);if(a)(c.kind==='url'?networks:contacts).append(a);});if(networks.childElementCount)sections.push(['Site & réseaux',networks]);if(contacts.childElementCount)sections.push(['Contact',contacts]);if(sections.length>1){const tabs=el('div','tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','Informations du membre');sections.forEach(([name,body],i)=>{body.id='section-'+i;body.setAttribute('role','tabpanel');body.setAttribute('aria-labelledby','tab-'+i);body.hidden=i!==0;const b=el('button','',name);b.setAttribute('data-theme',name==='Présentation'?'presentation':name==='Site & réseaux'?'reseaux':'contact');b.type='button';b.id='tab-'+i;b.setAttribute('role','tab');b.setAttribute('aria-controls',body.id);b.setAttribute('aria-selected',String(i===0));b.onclick=()=>sections.forEach(([,p],j)=>{p.hidden=i!==j;tabs.children[j].setAttribute('aria-selected',String(i===j));});b.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=tabs.children[(i+(e.key==='ArrowLeft'?-1:1)+sections.length)%sections.length];next.focus();next.click();}};tabs.append(b);});content.append(tabs);}sections.forEach(([,body])=>content.append(body));panel.append(content);if(!$('profile').open)$('profile').showModal();}
$('profile').addEventListener('click',e=>{if(e.target===$('profile')){const r=$('profile').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('profile').close();}});$('profile').addEventListener('close',()=>lastFocus?.focus());
$('search').addEventListener('input',()=>{const q=normalize($('search').value.trim()),results=$('results');results.replaceChildren();results.hidden=!q;if(!q)return;const matches=MEMBERS.filter(m=>normalize((m.name||'')+' '+(m.city||'')+' '+(m.conjoncture||'')).includes(q));matches.forEach(m=>{const b=el('button','result',m.name||m.city);b.type='button';if(m.conjoncture)b.append(el('small','',m.conjoncture));b.onclick=()=>{results.hidden=true;if(loaded)map.flyTo({center:m.coordinates,zoom:9});openProfile(m);};results.append(b);});if(!matches.length)results.append(el('div','result','Aucun membre trouvé.'));});
function collectionCarte(){return {type:'FeatureCollection',features:MEMBERS.map(m=>({type:'Feature',geometry:{type:'Point',coordinates:m.coordinates},properties:{id:m.id}}))};}
function initialiserPoints(){
 const canvas=document.createElement('canvas');canvas.width=72;canvas.height=88;const ctx=canvas.getContext('2d');ctx.scale(2,2);ctx.fillStyle='#965093';ctx.strokeStyle='#fffdf9';ctx.lineWidth=2;const path=new Path2D('M18 43S2 27 2 18a16 16 0 1 1 32 0c0 9-16 25-16 25Z');ctx.fill(path);ctx.stroke(path);ctx.beginPath();ctx.arc(18,18,6,0,Math.PI*2);ctx.fillStyle='#fffdf9';ctx.fill();map.addImage('epingle',{width:72,height:88,data:ctx.getImageData(0,0,72,88).data},{pixelRatio:2});
 map.addSource('members',{type:'geojson',data:collectionCarte(),cluster:true,clusterRadius:45,clusterMaxZoom:15});
 map.addLayer({id:'clusters',type:'circle',source:'members',filter:['has','point_count'],paint:{'circle-color':'#965093','circle-radius':['step',['get','point_count'],20,10,25,50,31],'circle-stroke-color':'#fffdf9','circle-stroke-width':3}});
 map.addLayer({id:'cluster-count',type:'symbol',source:'members',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-font':['Noto Sans Regular'],'text-size':13},paint:{'text-color':'#ffffff'}});
 map.addLayer({id:'member-pins',type:'symbol',source:'members',filter:['!',['has','point_count']],layout:{'icon-image':'epingle','icon-anchor':'bottom','icon-allow-overlap':true}});
 map.on('click','member-pins',e=>{const m=MEMBERS.find(m=>m.id===e.features[0].properties.id);if(m)openProfile(m);});
 map.on('click','clusters',async e=>{try{const f=e.features[0],src=map.getSource('members');const leaves=await src.getClusterLeaves(f.properties.cluster_id,Math.min(f.properties.point_count,1000),0);const first=leaves[0]?.geometry.coordinates;const same=first&&leaves.every(x=>Math.abs(x.geometry.coordinates[0]-first[0])<0.00001&&Math.abs(x.geometry.coordinates[1]-first[1])<0.00001);if(same||map.getZoom()>=15){const box=el('div','cluster-list');box.append(el('strong','',f.properties.point_count+' membres dans cette zone'));leaves.forEach(x=>{const m=MEMBERS.find(m=>m.id===x.properties.id);if(!m)return;const b=el('button','result',m.name||'Découvrir ce membre');b.type='button';if(m.conjoncture)b.append(el('small','',m.conjoncture));b.onclick=()=>{popup.remove();openProfile(m);};box.append(b);});const popup=new maplibregl.Popup({maxWidth:'300px'}).setLngLat(f.geometry.coordinates).setDOMContent(box).addTo(map);}else{const z=await src.getClusterExpansionZoom(f.properties.cluster_id);map.easeTo({center:f.geometry.coordinates,zoom:z});}}catch(err){console.warn('Regroupement',err);}});
 ['clusters','member-pins'].forEach(layer=>{map.on('mouseenter',layer,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',layer,()=>map.getCanvas().style.cursor='');});
}
function donneesValides(data){
 if(!data||data.ok!==true||!Array.isArray(data.members))throw new Error('Réponse de données invalide');
 const ids=new Set();
 for(const m of data.members){if(!m||typeof m.id!=='string'||!m.id||ids.has(m.id)||!Array.isArray(m.coordinates)||m.coordinates.length!==2||!m.coordinates.every(Number.isFinite)||Math.abs(m.coordinates[0])>180||Math.abs(m.coordinates[1])>90||!Array.isArray(m.contacts))throw new Error('Profil reçu invalide');ids.add(m.id);}
 return data.members;
}
async function actualiserMembres(){
 if(inFlight)return;inFlight=true;
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),55000);
 try{
  const response=await fetch(DATA_URL+'?t='+Date.now(),{method:'GET',credentials:'omit',redirect:'follow',signal:controller.signal});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const next=donneesValides(await response.json());
  const previous=MEMBERS.find(m=>m.id===currentMemberId);MEMBERS=next;
  if(loaded&&map.getSource('members'))map.getSource('members').setData(collectionCarte());
  if($('search').value.trim())$('search').dispatchEvent(new Event('input'));
  if($('profile').open&&currentMemberId){const m=MEMBERS.find(x=>x.id===currentMemberId);if(!m)$('profile').close();else if(JSON.stringify(previous)!==JSON.stringify(m))openProfile(m);}
  $('data-error').hidden=true;
  $('data-status').textContent=MEMBERS.length+' membre'+(MEMBERS.length>1?'s':'')+' · actualisation automatique';
 }catch(err){console.warn('Chargement des membres',err);$('data-error').hidden=false;$('data-error').textContent=MEMBERS.length?'La mise à jour des membres a échoué. Les derniers profils chargés restent affichés.':'Les profils ne peuvent pas être chargés. Vérifiez la connexion et l’accès public au service de données.';const retry=el('button','','Réessayer');retry.type='button';retry.onclick=actualiserMembres;$('data-error').append(retry);$('data-status').textContent=MEMBERS.length?'Dernières données conservées':'Chargement des profils interrompu';}
 finally{clearTimeout(timeout);inFlight=false;}
}
function failure(){const box=$('error');box.hidden=false;box.textContent='Le fond cartographique ne peut pas être chargé. La recherche de membres reste disponible.';}
try{if(typeof maplibregl==='undefined')throw new Error('MapLibre indisponible');map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',bounds:[[-5.2,41.3],[9.7,51.2]],fitBoundsOptions:{padding:{top:100,bottom:45,left:25,right:25},maxZoom:5.8},renderWorldCopies:false});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');map.on('load',()=>{initialiserPoints();loaded=true;});map.on('error',e=>console.warn('Fond cartographique',e.error));setTimeout(()=>{if(!loaded)failure();},14000);}catch(e){failure();console.warn(e);}
actualiserMembres();
setInterval(()=>{if(!document.hidden)actualiserMembres();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)actualiserMembres();});
</script></body></html>
