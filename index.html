<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Commu se Connecte — Carte des membres</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#263c38;font:15px/1.6 system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #a78bfa;outline-offset:4px}header{height:80px;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 28px;background:#fffdf9;border-bottom:1px solid #deded5}.brand{font:500 25px Georgia,serif}.brand small{display:block;font:12px system-ui;color:#6c7971;margin-top:4px}.searchbox{position:relative;width:min(340px,42vw)}#search{width:100%;padding:11px 16px;background:#f5f4ee;border:1px solid #d8dfd7;border-radius:24px;color:#263c38}.results{position:absolute;top:52px;right:0;left:0;background:#fffdf9;border-radius:15px;box-shadow:0 10px 30px #0002;z-index:10;max-height:300px;overflow:auto}.result{display:block;width:100%;border:0;border-bottom:1px solid #deded5;padding:14px;text-align:left;background:transparent;color:#263c38}.result:hover{background:#e8eee7}.result small{display:block;color:#65736c}.maparea{position:relative;height:calc(100dvh - 80px);min-height:400px}#map{position:absolute;inset:0}.caption{position:absolute;top:22px;left:22px;max-width:240px;padding:14px 18px;border-radius:16px;background:#fffdf9ed;box-shadow:0 5px 24px #1c302214;pointer-events:none}.caption strong{font:500 21px Georgia,serif}.caption small{display:block;color:#69776d;margin-top:5px}.pin{width:36px;height:44px;padding:0;border:0;background:none;filter:drop-shadow(0 3px 4px #0004)}.pin svg{display:block;width:36px;height:44px}.pin:hover{filter:drop-shadow(0 4px 7px #0007)}.error{position:absolute;bottom:45px;left:20px;right:20px;background:#fffdf9;padding:14px;border-radius:12px;z-index:3}.error button{margin-left:12px;background:#31574d;color:white;border:0;border-radius:8px;padding:8px 14px}dialog{position:fixed;border:0;padding:0;width:min(420px,calc(100vw - 32px));max-height:calc(100dvh - 40px);overflow:auto;border-radius:22px;background:#303030;color:#ededed;box-shadow:0 20px 90px #0006}dialog::backdrop{background:#10201b66;backdrop-filter:blur(3px)}.photoarea{position:relative;background:#252525}.portrait{display:block;width:100%;height:245px;object-fit:cover}.photo-error{padding:32px 22px;margin:0;color:#ded7eb;font-size:13px}.close{position:absolute;top:12px;right:12px;background:#181818c9;color:white;border:1px solid #ffffff40;border-radius:50%;height:36px;width:36px;font-size:23px;z-index:2}.content{padding:24px}h1{font-size:23px;line-height:1.3;margin:0 0 9px;font-weight:600}.conjoncture{color:#c1abea;font-size:16px;margin:0}.tabs{display:flex;gap:22px;border-bottom:1px solid #ffffff1a;margin:22px 0 16px}.tabs button{padding:8px 0;color:#bdbdbd;background:none;border:0;font-size:14px}.tabs button[aria-selected=true]{color:#c1abea;border-bottom:2px solid #ac83ed}.bio{white-space:pre-line;font-size:14px;line-height:1.8}.socials{display:flex;gap:11px;flex-wrap:wrap}.socials a{height:43px;min-width:43px;padding:10px;display:flex;align-items:center;justify-content:center;border-radius:11px;border:1px solid #ffffff26;color:#dedede;text-decoration:none}.socials a:hover{background:#ffffff12;color:#c1abea}.socials svg{width:21px;height:21px}.contact-name{margin-left:8px;font-size:13px}.footer{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:22px;padding-top:18px;border-top:1px solid #ffffff12}.footer a{color:#b28ae9;text-decoration:none;font-size:14px}.footer .socials{gap:7px}.footer .socials a{border:0;min-width:30px;height:32px;padding:5px;color:#d0d0d0}.testnote{position:absolute;bottom:30px;left:12px;font-size:11px;color:#334f42;background:#fffdf9df;padding:3px 9px;border-radius:5px;pointer-events:none}[hidden]{display:none!important}@media(max-width:600px){header{height:112px;padding:12px 16px;flex-wrap:wrap;gap:8px}.brand{font-size:22px}.brand small{display:none}.searchbox{width:100%}#search{padding:8px 13px}.results{top:42px}.maparea{height:calc(100dvh - 112px)}.caption{top:12px;left:12px;padding:10px 14px;max-width:210px}.caption strong{font-size:18px}.caption small{font-size:11px}.portrait{height:225px}.content{padding:21px}.testnote{max-width:80%}}
</style></head><body><header><div class="brand">La Commu se Connecte<small>Des parcours singuliers. Des liens à créer.</small></div><div class="searchbox"><input type="search" id="search" aria-label="Rechercher un membre ou une ville" placeholder="Rechercher un membre, une ville…" autocomplete="off"><div id="results" class="results" aria-live="polite" hidden></div></div></header><main class="maparea"><div id="map" role="region" aria-label="Carte du monde des membres de la communauté"></div><div class="caption"><strong>Et si on se rencontrait ?</strong><small>Cliquez sur une épingle pour découvrir un membre.</small></div><div id="error" class="error" role="status" hidden></div><div class="testnote">Prototype · 1 profil · synchronisation à raccorder</div></main><dialog id="profile" aria-label="Fiche du membre"><div id="profile-body"></div></dialog><script id="members-data" type="application/json">[{"id": "membre-1", "name": "Solange Gaillac", "city": "Bergerac (24100)", "coordinates": [0.4875, 44.8535], "photo": "https://drive.google.com/thumbnail?id=1FY8aab4sOVoHQfGgjSCRjMNqw2cQB3BT&sz=w800", "bio": "Après plusieurs années comme infirmière, je suis aujourd’hui en pleine reconversion professionnelle. Mon bilan de compétences m’a permis de mieux cerner mes forces et mes aspirations, avec une envie qui reste intacte : aider les autres, mais autrement.\n\nPassionnée par le digital, la créativité et l’entrepreneuriat, j’aime imaginer et développer des projets utiles, notamment autour du web et de l’intelligence artificielle.\n\nCurieuse, indépendante et touche-à-tout, j’adore apprendre, expérimenter et créer. Et loin des écrans, j’aime cuisiner, fabriquer des bijoux en résine UV et profiter des plaisirs simples de la vie, sans oublier mes deux Maine Coons qui occupent une belle place dans mon quotidien ! 🐾\n\nAujourd’hui, j’avance vers une nouvelle étape, avec l’envie de construire une activité qui me ressemble, de partager et de faire de belles rencontres !", "contacts": [{"label": "Site internet", "value": "https://cartesdevisitedigitales.fr/profil-libsolutions", "kind": "url"}, {"label": "Instagram", "value": "https://www.instagram.com/libsolutions.fr/", "kind": "url"}, {"label": "Facebook", "value": "https://www.facebook.com/solange.gaillac", "kind": "url"}, {"label": "Appeler", "value": "+33621016118", "kind": "phone"}, {"label": "E-mail", "value": "libsolutions.fr@gmail.com", "kind": "email"}, {"label": "WhatsApp", "value": "+33621016118", "kind": "whatsapp"}], "conjoncture": "2-3-8"}]</script><script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script>
'use strict';
const MEMBERS=JSON.parse(document.getElementById('members-data').textContent),$=id=>document.getElementById(id);let map,loaded=false,lastFocus;
const normalize=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const paths={site:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/>',email:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',phone:'<path d="M5 3h4l2 5-3 2c2 3 3 4 6 6l2-3 5 2v4c0 2-3 3-5 2C8 18 3 13 3 6c0-2 0-3 2-3Z"/>',whatsapp:'<path d="M4 17 3 22l5-2a9 9 0 1 0-4-3Z"/><path d="m8 7 2 3-1 1 4 4 1-1 3 2"/>',instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".7"/>',facebook:'<path d="M14 21V13h3l1-4h-4V7c0-1 1-2 2-2h2V2h-3c-4 0-5 2-5 5v2H7v4h3v8"/>',youtube:'<rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/>',linkedin:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 10v7M11 17v-7m0 3c0-4 6-4 6 0v4M7 7h.01"/>',tiktok:'<path d="M14 3v12a4 4 0 1 1-4-4M14 3c0 4 3 6 6 6"/>'};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e;}
function icon(kind){const span=el('span');span.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(paths[kind]||paths.site)+'</svg>';return span;}
function contact(c,compact=false){if(!c.value?.trim())return null;let href=c.value.trim();if(c.kind==='email')href='mailto:'+href;else if(c.kind==='phone')href='tel:'+href.replace(/[^+\d]/g,'');else if(c.kind==='whatsapp')href='https://wa.me/'+href.replace(/\D/g,'');else {if(!/^https?:\/\//i.test(href))href='https://'+href;try{const u=new URL(href);if(!['http:','https:'].includes(u.protocol))return null;}catch{return null;}}const kind=c.kind==='url'?({'Instagram':'instagram','Facebook':'facebook','LinkedIn':'linkedin','YouTube':'youtube','TikTok':'tiktok'}[c.label]||'site'):c.kind;const a=el('a');a.href=href;a.setAttribute('aria-label',c.label);a.title=c.label;a.append(icon(kind));if(!compact)a.append(el('span','contact-name',c.label));if(!['email','phone'].includes(c.kind)){a.target='_blank';a.rel='noopener noreferrer';}return a;}
function openProfile(m){lastFocus=document.activeElement;const panel=$('profile-body');panel.replaceChildren();const media=el('div','photoarea');const close=el('button','close','×');close.type='button';close.setAttribute('aria-label','Fermer la fiche');close.onclick=()=>$('profile').close();media.append(close);if(m.photo){const img=el('img','portrait');img.alt='Photo de '+(m.name||'ce membre');img.referrerPolicy='no-referrer';img.src=m.photo;img.onerror=()=>{img.hidden=true;const note=el('p','photo-error','La photo Drive ne peut pas être chargée. Son accès public reste à vérifier.');media.append(note);};media.append(img);}panel.append(media);const content=el('div','content');if(m.name)content.append(el('h1','',m.name));if(m.conjoncture?.trim())content.append(el('p','conjoncture','Conjoncture · '+m.conjoncture));const sections=[];if(m.bio?.trim())sections.push(['Présentation',el('div','bio',m.bio)]);const networks=el('div','socials'),contacts=el('div','socials');m.contacts.forEach(c=>{const a=contact(c);if(a)(c.kind==='url'?networks:contacts).append(a);});if(networks.childElementCount)sections.push(['Site & réseaux',networks]);if(contacts.childElementCount)sections.push(['Contact',contacts]);if(sections.length>1){const tabs=el('div','tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','Informations du membre');sections.forEach(([name,body],i)=>{body.id='section-'+i;body.setAttribute('role','tabpanel');body.setAttribute('aria-labelledby','tab-'+i);body.hidden=i!==0;const b=el('button','',name);b.type='button';b.id='tab-'+i;b.setAttribute('role','tab');b.setAttribute('aria-controls',body.id);b.setAttribute('aria-selected',String(i===0));b.onclick=()=>sections.forEach(([,p],j)=>{p.hidden=i!==j;tabs.children[j].setAttribute('aria-selected',String(i===j));});b.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=tabs.children[(i+(e.key==='ArrowLeft'?-1:1)+sections.length)%sections.length];next.focus();next.click();}};tabs.append(b);});content.append(tabs);}sections.forEach(([,body])=>content.append(body));panel.append(content);if(!$('profile').open)$('profile').showModal();}
$('profile').addEventListener('click',e=>{if(e.target===$('profile')){const r=$('profile').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('profile').close();}});$('profile').addEventListener('close',()=>lastFocus?.focus());
$('search').addEventListener('input',()=>{const q=normalize($('search').value.trim()),results=$('results');results.replaceChildren();results.hidden=!q;if(!q)return;const matches=MEMBERS.filter(m=>normalize(m.name+' '+m.city+' '+(m.conjoncture||'')).includes(q));matches.forEach(m=>{const b=el('button','result',m.name||m.city);b.type='button';if(m.conjoncture)b.append(el('small','',m.conjoncture));b.onclick=()=>{results.hidden=true;if(loaded)map.flyTo({center:m.coordinates,zoom:9});openProfile(m);};results.append(b);});if(!matches.length)results.append(el('div','result','Aucun membre trouvé.'));});
function failure(){const box=$('error');box.hidden=false;box.textContent='Le fond de carte ne s’affiche pas ici. ';const b=el('button','','Ouvrir le profil de test');b.type='button';b.onclick=()=>openProfile(MEMBERS[0]);box.append(b);}
try{if(typeof maplibregl==='undefined')throw new Error('MapLibre indisponible');map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:[5,30],zoom:1.7,renderWorldCopies:false});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');map.on('load',()=>{loaded=true;MEMBERS.forEach(m=>{const b=el('button','pin');b.type='button';b.setAttribute('aria-label','Découvrir '+(m.name||'ce membre'));b.innerHTML='<svg viewBox="0 0 36 44" aria-hidden="true"><path d="M18 43S2 27 2 18a16 16 0 1 1 32 0c0 9-16 25-16 25Z" fill="#7755a1" stroke="#fffdf9" stroke-width="2"/><circle cx="18" cy="18" r="6" fill="#fffdf9"/></svg>';b.onclick=e=>{e.stopPropagation();openProfile(m);};new maplibregl.Marker({element:b,anchor:'bottom'}).setLngLat(m.coordinates).addTo(map);});});map.on('error',e=>console.warn('Fond cartographique',e.error));setTimeout(()=>{if(!loaded)failure();},14000);}catch(e){failure();console.warn(e);}
</script></body></html>
